name: Release

# Desktop installers for Windows and Linux, published as a GitHub Release.
#
# Triggered by a "v*" tag and nothing else. The tag is the source of truth for
# the version, and a step below refuses to build when it disagrees with
# tauri.conf.json, because a release labelled v0.8.0 that installs 0.7.2 is
# worse than no release at all.
#
# A manual dispatch is deliberately absent: it cannot supply a tag to
# tauri-action, which would publish artefacts labelled with a branch name. To
# retry a failed build, delete the tag and push it again.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The platforms are independent, so a Linux packaging failure does not hold up
  # a Windows installer and the other way round.
  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ github.job }}

      # Tauri v2 on Linux. webkit2gtk-4.1 is the version Tauri v2 links
      # against; the older 4.0 package produces a tree that compiles and then
      # fails to link.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Check the tag matches the app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$TAG" != "$CONF" ]; then
            echo "::error::tag $TAG does not match tauri.conf.json version $CONF"
            exit 1
          fi

      - name: Install
        run: npm ci

      # The frontend is a static export and tauri.conf.json points
      # frontendDist at out/, so this has to happen before bundling.
      - name: Build frontend
        run: npm run build

      # deb and rpm for distributions, AppImage for anything that is not one.
      - name: Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AgamizCode ${{ github.ref_name }}
          releaseBody: |
            Desktop installers for Agamiz Code.

            Windows: NSIS installer and MSI.
            Linux: deb, rpm and AppImage.
          releaseDraft: false
          prerelease: false
          args: --bundles deb,rpm,appimage

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ github.job }}

      - name: Check the tag matches the app version
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v',''
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tag -ne $conf) {
            Write-Error "tag $tag does not match tauri.conf.json version $conf"
            exit 1
          }

      - name: Install
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AgamizCode ${{ github.ref_name }}
          releaseBody: |
            Desktop installers for Agamiz Code.

            Windows: NSIS installer and MSI.
            Linux: deb, rpm and AppImage.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi
