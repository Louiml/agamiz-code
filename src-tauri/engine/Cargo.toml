[package]
name = "agamiz-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "fs", "rt-multi-thread", "io-util", "time", "process", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
crossbeam-channel = "0.5"

tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"

notify = { version = "7" }

dashmap = "6"

git2 = "0.19"

log = "0.4"